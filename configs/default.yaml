# LF-Loc Default Configuration
# B: framework owner - tune these for experiments

model:
  backbone: "vit_base_patch14_dinov2"  # or "clip_vit_base_patch16"
  img_size: 224
  fpn_out: 256

training:
  batch_size: 8
  epochs: 20
  lr: 1e-4
  weight_decay: 1e-4
  num_workers: 2

loss:
  lambda_cls: 1.0
  lambda_seg: 1.0
  lambda_boundary: 1.0

paths:
  save_dir: "checkpoints"
  log_dir: "logs"
  data_dir: "data"

# Ablation configs (D + B will use these)
ablation:
  w_fbaa: true
  w_dice: true
  w_boundary: true
